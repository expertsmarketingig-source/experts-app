<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXPERTS · Panel Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const app = initializeApp({ databaseURL: "https://experts-app-7483c-default-rtdb.firebaseio.com/" });
  const db  = getDatabase(app);

  onValue(ref(db, 'tecnicos'), snap => {
    const data = snap.val() || {};
    window.renderTecnicos(data);
  });
</script>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #22263a;
  --brand: #1a6b2f;
  --brand-light: #e8f5ec;
  --accent: #f5a623;
  --danger: #e03131;
  --green: #22c55e;
  --text: #f0f2f5;
  --muted: #8b92a5;
  --border: #2e3347;
  --radius: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Barlow', sans-serif; min-height: 100vh; }

/* HEADER */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.logo-row { display: flex; align-items: center; gap: 14px; }
.logo-box { background: #1a6b2f; color: white; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 1.1rem; padding: 6px 10px; letter-spacing: 1px; line-height: 1; }
.logo-box span { font-size: 0.6rem; display: block; letter-spacing: 2px; opacity: 0.7; }
.header-title { font-family: 'Barlow Condensed', sans-serif; font-size: 1.2rem; font-weight: 700; }
.header-sub { font-size: 0.75rem; color: var(--muted); margin-top: 1px; }

.live-badge {
  display: flex; align-items: center; gap: 8px;
  background: rgba(34,197,94,0.1);
  border: 1px solid rgba(34,197,94,0.3);
  border-radius: 20px; padding: 6px 14px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 0.82rem; font-weight: 700; color: var(--green);
}
.live-dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:0.5; transform:scale(1.3); } }

/* STATS */
.stats-bar {
  display: flex; gap: 12px; padding: 16px 24px;
  background: var(--surface); border-bottom: 1px solid var(--border);
  overflow-x: auto; scrollbar-width: none;
}
.stats-bar::-webkit-scrollbar { display: none; }
.stat { background: var(--surface2); border-radius: 10px; padding: 12px 20px; text-align: center; min-width: 100px; border: 1px solid var(--border); }
.stat-num { font-family: 'Barlow Condensed', sans-serif; font-size: 1.8rem; font-weight: 800; line-height: 1; }
.stat-label { font-size: 0.7rem; color: var(--muted); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.5px; }
.stat.active .stat-num { color: var(--danger); }
.stat.libre .stat-num  { color: var(--green); }
.stat.total .stat-num  { color: var(--accent); }

/* MAIN CONTENT */
.main { padding: 20px 24px; }
.section-title {
  font-family: 'Barlow Condensed', sans-serif; font-size: 0.75rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 2px; color: var(--muted);
  margin-bottom: 14px; display: flex; align-items: center; gap: 10px;
}
.section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* TECNICO CARDS */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-bottom: 32px; }

.tecnico-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: transform .2s, box-shadow .2s;
}
.tecnico-card:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
.tecnico-card.en-servicio { border-color: rgba(224,49,49,0.5); box-shadow: 0 0 0 1px rgba(224,49,49,0.2); }
.tecnico-card.libre { border-color: rgba(34,197,94,0.3); }

/* TOP CARD */
.card-top {
  padding: 18px 20px 14px;
  display: flex; align-items: center; gap: 14px;
  position: relative;
}
.avatar {
  width: 56px; height: 56px; border-radius: 50%;
  background: linear-gradient(135deg, #1a6b2f, #2ea04d);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Barlow Condensed', sans-serif; font-size: 1.4rem; font-weight: 800;
  color: white; flex-shrink: 0; position: relative;
}
.avatar-ring {
  position: absolute; inset: -3px; border-radius: 50%;
  border: 2.5px solid transparent;
}
.en-servicio .avatar-ring { border-color: var(--danger); animation: ringPulse 1.5s infinite; }
.libre .avatar-ring { border-color: var(--green); }
@keyframes ringPulse {
  0%,100%{ opacity:1; box-shadow: 0 0 0 0 rgba(224,49,49,0.4); }
  50%{ opacity:0.8; box-shadow: 0 0 0 6px rgba(224,49,49,0); }
}

.tecnico-info { flex: 1; }
.tecnico-nombre { font-family: 'Barlow Condensed', sans-serif; font-size: 1.15rem; font-weight: 800; }
.tecnico-estado { display: inline-flex; align-items: center; gap: 5px; margin-top: 4px; font-size: 0.78rem; font-weight: 700; font-family: 'Barlow Condensed', sans-serif; letter-spacing: 0.5px; padding: 3px 10px; border-radius: 20px; }
.estado-activo { background: rgba(224,49,49,0.15); color: #f87171; }
.estado-libre  { background: rgba(34,197,94,0.12); color: var(--green); }
.estado-dot    { width: 7px; height: 7px; border-radius: 50%; }
.activo-dot    { background: #f87171; animation: pulse 1.2s infinite; }
.libre-dot     { background: var(--green); }

/* CARD BODY */
.card-body { padding: 0 20px 16px; }
.card-info-row {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; background: var(--surface2);
  border-radius: 8px; margin-bottom: 8px;
  font-size: 0.85rem;
}
.card-info-row .icon { font-size: 1rem; flex-shrink: 0; }
.card-info-row .label { color: var(--muted); font-size: 0.75rem; }
.card-info-row .value { font-weight: 600; }

/* CRONOMETRO EN VIVO */
.crono-box {
  background: rgba(224,49,49,0.08);
  border: 1px solid rgba(224,49,49,0.2);
  border-radius: 10px;
  padding: 10px 14px;
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px;
}
.crono-label { font-size: 0.72rem; color: #f87171; text-transform: uppercase; letter-spacing: 1px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; }
.crono-time { font-family: 'Barlow Condensed', sans-serif; font-size: 1.4rem; font-weight: 800; color: #f87171; letter-spacing: 2px; }

/* ULTIMO SERVICIO */
.ultimo-box {
  background: rgba(34,197,94,0.06);
  border: 1px solid rgba(34,197,94,0.15);
  border-radius: 10px; padding: 10px 14px;
}
.ultimo-label { font-size: 0.72rem; color: var(--green); text-transform: uppercase; letter-spacing: 1px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; margin-bottom: 3px; }
.ultimo-val { font-size: 0.88rem; font-weight: 600; }
.ultimo-dur { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

/* EMPTY */
.empty { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty-icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.4; }
.empty-title { font-family: 'Barlow Condensed', sans-serif; font-size: 1.1rem; color: var(--text); opacity: 0.6; }
.empty-sub { font-size: 0.82rem; margin-top: 6px; line-height: 1.5; }

/* HORA */
.hora-actual { font-family: 'Barlow Condensed', sans-serif; font-size: 0.9rem; color: var(--muted); }

/* RESPONSIVE */
@media (max-width: 600px) {
  .stats-bar { padding: 12px 16px; }
  .main { padding: 16px; }
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="header">
  <div class="logo-row">
    <div class="logo-box">EX<span>PERTS</span></div>
    <div>
      <div class="header-title">Panel de Control</div>
      <div class="header-sub">Administración · Tiempo real</div>
    </div>
  </div>
  <div style="display:flex;gap:10px;align-items:center">
    <div class="hora-actual" id="horaActual"></div>
    <div class="live-badge"><div class="live-dot"></div>EN VIVO</div>
  </div>
</div>

<div class="stats-bar">
  <div class="stat total">
    <div class="stat-num" id="statTotal">0</div>
    <div class="stat-label">Técnicos</div>
  </div>
  <div class="stat active">
    <div class="stat-num" id="statActivos">0</div>
    <div class="stat-label">En servicio</div>
  </div>
  <div class="stat libre">
    <div class="stat-num" id="statLibres">0</div>
    <div class="stat-label">Disponibles</div>
  </div>
  <div class="stat" style="">
    <div class="stat-num" id="statHoy" style="color:var(--accent)">0</div>
    <div class="stat-label">Servicios hoy</div>
  </div>
</div>

<div class="main">
  <div class="section-title">Estado de técnicos</div>
  <div class="grid" id="tecnicosGrid">
    <div class="empty">
      <div class="empty-icon">📡</div>
      <div class="empty-title">Esperando conexión...</div>
      <div class="empty-sub">Los técnicos aparecerán aquí en tiempo real<br>cuando inicien un servicio desde la app</div>
    </div>
  </div>
</div>

<script>
// ── RELOJ ──
function tickClock() {
  document.getElementById('horaActual').textContent =
    new Date().toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}
setInterval(tickClock, 1000); tickClock();

// ── CRONÓMETROS EN VIVO ──
const cronos = {}; // tecId → intervalId

function startCrono(tecId, inicioISO) {
  if (cronos[tecId]) clearInterval(cronos[tecId]);
  cronos[tecId] = setInterval(() => {
    const el = document.getElementById('crono_' + tecId);
    if (!el) { clearInterval(cronos[tecId]); return; }
    const ms = Date.now() - new Date(inicioISO).getTime();
    el.textContent = formatTime(ms);
  }, 1000);
}

function stopCrono(tecId) {
  if (cronos[tecId]) { clearInterval(cronos[tecId]); delete cronos[tecId]; }
}

function formatTime(ms) {
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600).toString().padStart(2,'0');
  const m = Math.floor((s % 3600) / 60).toString().padStart(2,'0');
  const sec = (s % 60).toString().padStart(2,'0');
  return `${h}:${m}:${sec}`;
}

// ── INICIALES AVATAR ──
function initiales(nombre) {
  return nombre.split(' ').map(w => w[0]).join('').substring(0,2).toUpperCase();
}

// ── RENDER TÉCNICOS (llamado por Firebase) ──
let serviciosHoy = 0;
window.renderTecnicos = function(data) {
  const grid = document.getElementById('tecnicosGrid');
  const keys = Object.keys(data);

  if (keys.length === 0) {
    grid.innerHTML = `<div class="empty"><div class="empty-icon">📡</div><div class="empty-title">Esperando conexión...</div><div class="empty-sub">Los técnicos aparecerán aquí en tiempo real<br>cuando inicien un servicio desde la app</div></div>`;
    updateStats(0, 0, 0);
    return;
  }

  let activos = 0, libres = 0;
  serviciosHoy = 0;

  // Parar cronos viejos
  Object.keys(cronos).forEach(id => { if (!data[id]) stopCrono(id); });

  grid.innerHTML = keys.map(tecId => {
    const t = data[tecId];
    const enServicio = t.estado === 'en_servicio';
    if (enServicio) activos++; else libres++;

    // Contar servicios de hoy
    if (!enServicio && t.ultimoServicio) {
      const ts = new Date(t.timestamp);
      const hoy = new Date();
      if (ts.toDateString() === hoy.toDateString()) serviciosHoy++;
    }

    const ini = enServicio && t.inicio ? new Date(t.inicio) : null;
    const horaInicio = ini ? ini.toLocaleTimeString('es-AR', {hour:'2-digit',minute:'2-digit'}) : '';
    const msTranscurrido = ini ? Date.now() - ini.getTime() : 0;

    return `
    <div class="tecnico-card ${enServicio ? 'en-servicio' : 'libre'}">
      <div class="card-top">
        <div class="avatar">
          <div class="avatar-ring"></div>
          ${initiales(t.nombre)}
        </div>
        <div class="tecnico-info">
          <div class="tecnico-nombre">${t.nombre}</div>
          <div class="tecnico-estado ${enServicio ? 'estado-activo' : 'estado-libre'}">
            <div class="estado-dot ${enServicio ? 'activo-dot' : 'libre-dot'}"></div>
            ${enServicio ? 'EN SERVICIO' : 'DISPONIBLE'}
          </div>
        </div>
      </div>
      <div class="card-body">
        ${enServicio ? `
          <div class="crono-box">
            <div>
              <div class="crono-label">⏱ Tiempo transcurrido</div>
              <div class="crono-time" id="crono_${tecId}">${formatTime(msTranscurrido)}</div>
            </div>
            <div style="text-align:right">
              <div style="font-size:0.72rem;color:var(--muted)">Inicio</div>
              <div style="font-family:'Barlow Condensed',sans-serif;font-size:1rem;font-weight:700;color:#f87171">${horaInicio}</div>
            </div>
          </div>
          <div class="card-info-row">
            <span class="icon">🏢</span>
            <div>
              <div class="label">Cliente actual</div>
              <div class="value">${t.cliente || '—'}</div>
            </div>
          </div>
        ` : `
          <div class="ultimo-box">
            <div class="ultimo-label">✅ Último servicio</div>
            <div class="ultimo-val">${t.ultimoServicio || 'Sin registros aún'}</div>
            ${t.duracion ? `<div class="ultimo-dur">Duración: ${t.duracion}</div>` : ''}
          </div>
        `}
      </div>
    </div>`;
  }).join('');

  // Arrancar cronómetros para los activos
  keys.forEach(tecId => {
    const t = data[tecId];
    if (t.estado === 'en_servicio' && t.inicio) {
      startCrono(tecId, t.inicio);
    } else {
      stopCrono(tecId);
    }
  });

  updateStats(keys.length, activos, libres);
};

function updateStats(total, activos, libres) {
  document.getElementById('statTotal').textContent   = total;
  document.getElementById('statActivos').textContent = activos;
  document.getElementById('statLibres').textContent  = libres;
  document.getElementById('statHoy').textContent     = serviciosHoy;
}
</script>
</body>
</html>
